<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Farmacia - Catalogo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f7f5f2;color:#222}
header{padding:24px 18px}
h1{margin:0 0 8px}
input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:12px}
.search{padding:0 16px 14px}
#categories{display:flex;gap:8px;overflow:auto;padding:0 16px 16px}
button{padding:9px 14px;border:1px solid #ddd;border-radius:22px;background:white}
button.active{background:#263f35;color:white}
#catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 14px}
.product{border-radius:14px;overflow:hidden;background:white;border:1px solid #eee}
.product img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.details{padding:11px}
.details h3{font-size:15px;margin:0 0 8px}
.price{font-size:17px;font-weight:bold}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:#777}
</style>
</head>
<body>
<header><h1>La Farmacia</h1><p>Il nostro catalogo</p></header>
<div class="search"><input id="search" placeholder="Cerca un prodotto..."></div>
<nav id="categories"></nav>
<main id="catalog"></main>
<script>
const products = [
{
  name: "CALI USA,
  category: "WITHE RUNTZ",
  video: "WhatsApp Video 2026-10-16 at 10.36.35 (1).mp4",
  prices: "10g 120€  12€/g | 25g 250€  10€/g | 50g 420€  8,2€/g | 100g 720€  7,2€/g | "
},
{
  name: "Dry Premium",
  category: "Sushi Farmz",
  video: "WhatsApp Video 2026-10-16 at 10.36.35.mp4",
  prices: "10g 80€  8€/g | 25g 180€  7,2€/g | 50g 290€  5,8€/g | 100g 480€  4,8€/g |"
},
{
  name: "Static Premium",
  category: "Cheese / Fraisee",
  video: "WhatsApp Video 2026-10-16 at 10.40.11.mp4",
  prices: "10g 110€  11€/g | 25g 230€  9.2€/g | 50g 390€  7,8€/g | 100g 680€  6,8€/g |"
}
];
const catalog=document.getElementById('catalog');
const nav=document.getElementById('categories');
const search=document.getElementById('search');
let selected='Tutti';
function render(){
 const cats=['Tutti',...new Set(products.map(p=>p.category).filter(Boolean))];
 nav.replaceChildren();
 cats.forEach(c=>{
  const b=document.createElement('button');
  b.textContent=c;b.className=c===selected?'active':'';
  b.onclick=()=>{selected=c;render()};
  nav.appendChild(b);
 });
 catalog.replaceChildren();
 const list=products.filter(p=>(selected==='Tutti'||p.category===selected)&&p.name.toLowerCase().includes(search.value.toLowerCase()));
 if(!list.length){
  const e=document.createElement('div');e.className='empty';
  e.textContent=products.length?'Nessun prodotto trovato':'Catalogo pronto: aggiungi i tuoi prodotti nel codice.';
  catalog.appendChild(e);return;
 }
 list.forEach(p => {
  const card = document.createElement('article');
  card.className = 'product';

  if (p.video) {
    const video = document.createElement('video');
    video.src = encodeURI(p.video);
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.style.width = '100%';
    card.appendChild(video);
  }

  const d = document.createElement('div');
  d.className = 'details';

  const h = document.createElement('h3');
  h.textContent = p.name;

  const price = document.createElement('div');
  price.className = 'price';
  price.textContent = p.prices;

  d.append(h, price);
  card.appendChild(d);
  catalog.appendChild(card);
});
}
search.addEventListener('input',render);
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
render();
</script>
</body>
</html>
